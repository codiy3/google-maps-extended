[project]
name = "google-maps-railway-viewer"
version = "0.1.0"
description = "全国鉄道路線の駅と線形を整備するデータ処理"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false
python-preference = "only-managed"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.7",
]
