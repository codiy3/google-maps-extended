name: Check and publish public demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: google-maps-railway-viewer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: google-maps-railway-viewer/.node-version
          cache: npm
          cache-dependency-path: google-maps-railway-viewer/package-lock.json
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: uv sync --locked
      - run: uv run --locked python -m railway_data --download
      - run: npm run data:build
      - run: npm run data:public
      - run: uv run --locked ruff format --check railway_data tests
      - run: uv run --locked ruff check railway_data tests
      - run: uv run --locked mypy railway_data tests
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: npm run check
      - run: npm test
      - run: npm run test:launch
      - run: npm run build:public
        env:
          VITE_GOOGLE_MAPS_API_KEY: RAILWAY_PUBLIC_BUILD_TEST_KEY_NOT_A_REAL_KEY
      - run: node scripts/verify-public.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          path: google-maps-railway-viewer/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
